<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#0F263A' } } } }
    </script>
</head>

<body class="bg-gray-100 min-h-screen p-6 flex items-center justify-center">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
        <div id="loader" class="p-20 text-center text-brand font-bold">Loading Profile...</div>

        <div id="profileContent" class="hidden p-10">
            <header class="text-center mb-8">
                <div class="w-24 h-24 bg-brand text-white rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-4"
                    id="avatar">
                    ??
                </div>
                <h1 class="text-3xl font-extrabold text-brand tracking-tight" id="disp-username">---</h1>
                <p class="text-gray-400 font-medium" id="disp-role">---</p>
            </header>

            <div class="space-y-4 border-t border-gray-100 pt-6">
                <div class="flex justify-between">
                    <span class="text-gray-500 font-bold uppercase text-xs">Email</span>
                    <span class="text-brand font-medium" id="disp-email">---</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500 font-bold uppercase text-xs">Account Status</span>
                    <span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-[10px] font-bold"
                        id="disp-status">ACTIVE</span>
                </div>
            </div>

            <button id="logoutBtn"
                class="mt-10 w-full py-4 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white font-bold rounded-2xl transition-all active:scale-95 border border-red-100">
                Logout Session
            </button>
        </div>
    </div>

    <script>
        const getCookie = (name) => {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        };

        const token = getCookie('accessToken');

        // 1. Fetch Current User Details
        async function fetchUserDetails() {
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('https://api.freeapi.app/api/v1/users/current-user', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'accept': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok) {
                    const user = result.data;
                    document.getElementById('disp-username').textContent = user.username;
                    document.getElementById('disp-email').textContent = user.email;
                    document.getElementById('disp-role').textContent = user.role;
                    document.getElementById('avatar').textContent = user.username.charAt(0).toUpperCase();

                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('profileContent').classList.remove('hidden');
                } else {
                    throw new Error('Session expired');
                }
            } catch (error) {
                console.error(error);
                window.location.href = 'index.html';
            }
        }

        // 2. Handle API Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('https://api.freeapi.app/api/v1/users/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Clear local credentials regardless of server success
                    document.cookie = "accessToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                    localStorage.removeItem('userProfile');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error("Logout failed", error);
                // Force logout locally anyway
                document.cookie = "accessToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                window.location.href = 'index.html';
            }
        });

        window.onload = fetchUserDetails;
    </script>
</body>

</html>
