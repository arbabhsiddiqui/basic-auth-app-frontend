<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0F263A',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
        <div class="p-10">
            <header class="text-center mb-8">
                <h1 class="text-4xl font-extrabold text-brand tracking-tight">Create Account</h1>
                <p class="text-gray-400 mt-2 font-medium">Join the administration team</p>
            </header>

            <form id="regForm" class="grid grid-cols-1 gap-5">

                <!-- Username Field -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2 ml-1">Username</label>
                    <input type="text" id="username" required
                        class="w-full px-5 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none transition-all duration-200"
                        placeholder="doejohn">
                </div>

                <!-- Email Field -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2 ml-1">Email Address</label>
                    <input type="email" id="email" required
                        class="w-full px-5 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none transition-all duration-200"
                        placeholder="user.email@domain.com">
                </div>

                <!-- Password Field -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2 ml-1">Security Key
                        (Password)</label>
                    <input type="password" id="password" required
                        class="w-full px-5 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none transition-all duration-200"
                        placeholder="••••••••">
                </div>

                <!-- Role Selection -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2 ml-1">Access Role</label>
                    <select id="role"
                        class="w-full px-5 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none appearance-none cursor-pointer">
                        <option value="USER">User</option>
                        <option value="ADMIN">Admin</option>
                        <option value="EDITOR">Editor</option>
                    </select>
                </div>

                <!-- Submit -->
                <button type="submit"
                    class="mt-4 w-full py-4 bg-brand hover:bg-slate-800 text-white font-bold rounded-2xl shadow-lg shadow-brand/20 transition-all hover:-translate-y-0.5 active:scale-95">
                    Register Member
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">Do you have an account? <a href="/"
                        class="text-brand font-bold hover:underline">Login</a></p>
            </div>

            <div id="output" class="hidden mt-8 p-4 bg-emerald-50 border border-emerald-100 rounded-xl">
                <p class="text-xs font-mono text-emerald-800 break-words" id="jsonResult"></p>
            </div>
        </div>
    </div>

    <script>
        // Data provided by you
        const initialData = {
            "email": "user.email@domain.com",
            "password": "test@123",
            "role": "ADMIN",
            "username": "doejohn"
        };

        // Pre-fill the form with your data
        window.onload = () => {

            (function () {
                // Function to extract the token from cookies
                const getCookie = (name) => {
                    const value = `; ${document.cookie}`;
                    const parts = value.split(`; ${name}=`);
                    if (parts.length === 2) return parts.pop().split(';').shift();
                };

                const token = getCookie('accessToken');

                // If token exists, redirect to profile immediately
                if (token) {
                    window.location.href = 'profile.html';
                }
            })();

            document.getElementById('email').value = initialData.email;
            document.getElementById('password').value = initialData.password;
            document.getElementById('username').value = initialData.username;
            document.getElementById('role').value = initialData.role;
        };

        // Handle Form Submission
        const regForm = document.getElementById('regForm');
        const output = document.getElementById('output');
        const jsonResult = document.getElementById('jsonResult');

        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Collect current values
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            const url = 'https://api.freeapi.app/api/v1/users/register';
            const options = {
                method: 'POST',
                headers: { accept: 'application/json', 'content-type': 'application/json' },
                body: JSON.stringify(formData)
            };

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                output.classList.remove('hidden');
                jsonResult.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error(error);
            }

        });
    </script>

</body>

</html>
