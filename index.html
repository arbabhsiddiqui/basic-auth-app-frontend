<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0F263A',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
        <div class="p-10">
            <header class="text-center mb-8">
                <h1 class="text-4xl font-extrabold text-brand tracking-tight">Admin Login</h1>
                <p class="text-gray-400 mt-2 font-medium">Access your dashboard</p>
            </header>

            <form id="loginForm" class="grid grid-cols-1 gap-5">

                <!-- Username/Email Field -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2 ml-1">Username</label>
                    <input type="text" id="username" required
                        class="w-full px-5 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none transition-all duration-200"
                        placeholder="doejohn">
                </div>

                <!-- Password Field -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2 ml-1">Password</label>
                    <input type="password" id="password" required
                        class="w-full px-5 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none transition-all duration-200"
                        placeholder="••••••••">
                </div>

                <!-- Submit -->
                <button type="submit"
                    class="mt-4 w-full py-4 bg-brand hover:bg-slate-800 text-white font-bold rounded-2xl shadow-lg shadow-brand/20 transition-all hover:-translate-y-0.5 active:scale-95">
                    Sign In
                </button>
            </form>

            <!-- Success/Error Output -->
            <div id="output" class="hidden mt-8 p-4 rounded-xl border">
                <p class="text-xs font-mono break-words" id="jsonResult"></p>
            </div>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">Don't have an account? <a href="/register.html"
                        class="text-brand font-bold hover:underline">Register</a></p>
            </div>
        </div>
    </div>

    <script>
        // Data provided for testing
        const credentials = {
            "password": "test@123",
            "username": "doejohn"
        };

        // Pre-fill fields for easy testing
        window.onload = () => {
            (function () {
                // Function to extract the token from cookies
                const getCookie = (name) => {
                    const value = `; ${document.cookie}`;
                    const parts = value.split(`; ${name}=`);
                    if (parts.length === 2) return parts.pop().split(';').shift();
                };

                const token = getCookie('accessToken');

                // If token exists, redirect to profile immediately
                if (token) {
                    window.location.href = 'profile.html';
                }
            })();
            document.getElementById('username').value = credentials.username;
            document.getElementById('password').value = credentials.password;
        };

        const loginForm = document.getElementById('loginForm');
        const output = document.getElementById('output');
        const jsonResult = document.getElementById('jsonResult');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            };

            // Using the login endpoint for freeapi.app
            const url = 'https://api.freeapi.app/api/v1/users/login';
            const options = {
                method: 'POST',
                headers: {
                    'accept': 'application/json',
                    'content-type': 'application/json'
                },
                body: JSON.stringify(loginData)
            };

            try {
                const response = await fetch(url, options);
                const data = await response.json();

                output.classList.remove('hidden');

                if (response.ok) {
                    // 1. Save Token in Cookie (Expires in 1 day)
                    const token = data.data.accessToken;
                    document.cookie = `accessToken=${token}; path=/; max-age=86400; SameSite=Strict`;

                    // 2. Save User Data for the profile page
                    localStorage.setItem('userProfile', JSON.stringify(data.data.user));

                    // 3. Success Message & Redirect
                    output.className = "mt-8 p-4 bg-emerald-50 border border-emerald-100 rounded-xl block";
                    jsonResult.textContent = "Login Successful! Redirecting...";

                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 1500);

                } else {
                    // API returned an error (e.g. 401 or 404)
                    output.className = "mt-8 p-4 bg-red-50 border border-red-100 rounded-xl block";
                    jsonResult.className = "text-xs font-mono text-red-800";
                    jsonResult.textContent = "Error: " + (data.message || "Invalid Credentials");
                }
            } catch (error) {
                console.error("Network Error:", error);
                output.classList.remove('hidden');
                output.className = "mt-8 p-4 bg-red-50 border border-red-100 rounded-xl block";
                jsonResult.textContent = "Connection failed. Please check the API status.";
            }
        });
    </script>
</body>

</html>
